<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>

<body>

    <h1>Contact Us:</h1>
    <form>

        <fieldset>
            <legend>Personal Details:</legend>

            <label for="fname">First name:</label>
            <input type="text" id="fname" name="fname" placeholder="John" required>

            <label for="mname">Middle name:</label>
            <input type="text" id="mname" name="mname" placeholder="F.">

            <label for="lname">Last name:</label>
            <input type="text" id="lname" name="lname" placeholder="Kennedy">
        </fieldset>
        <br>

        <fieldset>
            <legend>Contact Details:</legend>

            <label for="mobile">Mobile phone:</label>
            <input type="tel" id="mobile" name="mobile" placeholder="0524545795">
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="John@fkennedy.com" required>
            <br><br>
            <strong>How do you prefer we will contact you?</strong>
            <br>

            <input type="checkbox" id="checkEmail" name="checkEmail">
            <label for="checkEmail">Email</label>

            <input type="checkbox" id="checkPhone" name="checkPhone">
            <label for="checkPhone">Phone</label>

        </fieldset>
        <br>
        <fieldset>
            <legend>Message:</legend>

            <label for="cat">Category:</label>
            <select id="cat" name="cat">
                <option value="complaint">Complaint</option>
                <option value="suggestion">Suggestion</option>
            </select>
            <br><br>
            <label for="message">Please Elaborate:</label><br>
            <textarea id="message" name="message"
                placeholder="I want to become the president of the United States of America"></textarea>

        </fieldset>
        <br>
        <fieldset>
            <legend>Subscribe:</legend>
            <strong>I agree to the terms and conditions and to be informed of upcoming events:</strong>
            <label>
                <input type="radio" name="subscribe" value="yes">
                Yes
            </label>

            <label>
                <input type="radio" name="subscribe" value="no">
                No
            </label>

        </fieldset>
        <br>
        <input type="submit" value="Submit"><input type="reset" value="reset">
    </form>









</body>

</html>
